<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Azur Lane Automaton</title>
<style>body{background:#101822;color:#e4ecf5;font:16px system-ui;margin:40px auto;padding:0 24px;max-width:1000px}h1{font-size:32px}section{background:#1b2939;padding:24px;border-radius:16px;margin:20px 0}button{font:inherit;padding:12px 25px;border:0;border-radius:8px;margin:6px;background:#80d5cc;color:#11242a;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#b7cce0}#error{color:#ffb5ac}a{color:#80d5cc}</style>
<h1>Azur Lane Automaton</h1><p>Debian appliance · Framework preview</p>
<section><h2 id="state">Connecting…</h2><p id="details"></p><p>Idle mode is active. Running the service performs no game actions.</p><button onclick="control('start')">Start</button><button onclick="control('stop')">Stop</button><button onclick="control('restart')">Restart</button><p id="error" role="alert"></p></section>
<section><h2>Service log</h2><pre id="logs"></pre></section><section><h2>Automatic updates</h2><p>Checks main every five minutes. Validated updates restart services that are running.</p><pre id="updates"></pre><pre id="update_logs"></pre></section>
<script>
async function refresh(){try{const r=await fetch('/api/status');const s=await r.json();if(!r.ok)throw Error(s.error);document.getElementById('state').textContent=s.ActiveState+' · '+s.SubState;document.getElementById('details').textContent='Revision '+s.revision+' · PID '+s.MainPID+' · '+s.mode;for(const key of ['logs','updates','update_logs'])document.getElementById(key).textContent=s[key];document.getElementById('error').textContent='';}catch(e){document.getElementById('state').textContent='Connection unavailable';document.getElementById('error').textContent=e.message;}}
async function control(action){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Automaton-Control':'1'},body:'{}'});const s=await r.json();if(!r.ok)throw Error(s.error);await refresh();}catch(e){document.getElementById('error').textContent=e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
refresh();setInterval(refresh,5000);
</script></html>
